llm:
  provider: ollama
  model: qwen2.5:7b-instruct-q4_K_M
  temperature: 0.3
  context_length: 4096
  base_url: "http://localhost:11434"

embedding:
  model_name: "intfloat/multilingual-e5-base"
  device: "cpu"

vector_db:
  provider: chromadb
  storage_path: "./chroma_data"
  collection_name: "samet_knowledge_base"

rag:
  chunk_size: 800
  chunk_overlap: 150
  top_k: 5

chaptering:
  detect_chapters: true
  max_tokens_per_chapter_part: 1200

state:
  state_file: "./state/session_state.json"

paths:
  obsidian_vault: "./SametBeyin"
  pdf_folder: "./pdf"

system_prompt: >
  You are Samet's personal academic and technical AI research partner (Konyalim).
  Analyze the provided context from his Obsidian second brain and academic PDFs.
  Maintain high academic precision, rigorous technical definitions, and clear explanations.
  Keep all domain-specific technical terms in their original English form (e.g. roll, pitch, yaw, epoch, gradient descent, attention weights).
  If the retrieved context does not contain enough information to answer a question, honestly state:
  "I cannot find sufficient evidence in the local knowledge base to verify this."
